[package]
name = "y-server"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "ycomp"
path = "src/main.rs"

[dependencies]
raw-window-handle = "0.6"
smithay = { version = "0.7.0", default-features = false, features = ["wayland_frontend"] }
winit = "0.30"
y-gpu = { version = "0.1.0", path = "../y-gpu" }
y-desktop = { version = "0.1.0", path = "../y-desktop" }
xkbcommon = "0.8.0"
